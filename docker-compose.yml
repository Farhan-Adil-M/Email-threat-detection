services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    # ports removed - not exposed externally
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    # ports removed - not exposed externally
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sentinel-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEMO_MODE: "false"
      EVIDENCE_STORAGE_PATH: /app/data/storage
      MAX_UPLOAD_SIZE: "26214400"
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:3000"]'
      INTEL_MODE: ${INTEL_MODE:-disabled}
      INTEL_DNS_TIMEOUT: "2.0"
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - evidence_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: sentinel-worker
    command: celery -A app.tasks.worker worker -l info -Q celery
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: INFO
      INTEL_MODE: ${INTEL_MODE:-disabled}
    volumes:
      - ./backend:/app
      - evidence_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sentinel-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_storage: